[tasks."backend:setup"]
description = "Install backend dependencies"
dir = "backend"
run = "uv sync --locked"

[tasks."frontend:setup"]
description = "Install frontend dependencies"
dir = "frontend"
run = "npm ci"

[tasks."env:setup"]
description = "Create development environment files"
run = '''
set -eu

create_env_file() {
    source=$1
    destination=$2
    key=$3
    value=$4

    if [ -e "$destination" ]; then
        printf 'skip: %s already exists\n' "$destination"
        return
    fi

    temporary="${destination}.tmp"
    found=false

    while IFS= read -r line || [ -n "$line" ]; do
        if [ "$line" = "${key}=" ]; then
            printf '%s=%s\n' "$key" "$value"
            found=true
        else
            printf '%s\n' "$line"
        fi
    done < "$source" > "$temporary"

    if [ "$found" != true ]; then
        rm -f "$temporary"
        printf 'error: missing expected key %s in %s\n' "$key" "$source" >&2
        exit 1
    fi

    mv "$temporary" "$destination"
    printf 'created: %s\n' "$destination"
}

create_env_file \
    backend/.env.development.example \
    backend/.env.development \
    DJANGO_SECRET_KEY \
    '{{ choice(n=64, alphabet="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_") }}'

create_env_file \
    frontend/.env.development.example \
    frontend/.env.development \
    SESSION_SECRET \
    '{{ choice(n=64, alphabet="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_") }}'
'''

[tasks."frontend:api"]
description = "Generate the frontend API client"
dir = "frontend"
run = "npm run api:generate"

[tasks.setup]
description = "Set up the development environment"
run = [
    { tasks = ["backend:setup", "frontend:setup"] },
    { task = "env:setup" },
    { task = "frontend:api" },
]

[tasks."backend:dev"]
description = "Start the backend development server"
dir = "backend"
run = "uv run poe dev"

[tasks."frontend:dev"]
description = "Start the frontend development server"
dir = "frontend"
run = "npm run dev"

[tasks.dev]
description = "Start the development environment"
run = [
    { tasks = ["backend:dev", "frontend:dev"] },
]

[tasks."backend:format"]
description = "Format backend files"
dir = "backend"
run = "uv run poe format"

[tasks."frontend:format"]
description = "Format frontend files"
dir = "frontend"
run = "npm run format"

[tasks.format]
description = "Format the repository"
run = [
    { tasks = ["backend:format", "frontend:format"] },
]

[tasks."backend:ci"]
description = "Run backend CI checks"
dir = "backend"
run = "uv run poe ci"

[tasks."frontend:ci"]
description = "Run frontend CI checks"
dir = "frontend"
env = { _.file = "frontend/.env.test" }
run = "npm run ci"

[tasks.ci]
description = "Run repository CI checks"
run = [
    { tasks = ["backend:ci", "frontend:ci"] },
]
