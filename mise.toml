min_version = "2026.6.0"

[tools]
python = "3.14"
node = "24.19.0"
uv = "0.12.6"
lefthook = "2.1.12"

[tasks."backend:setup"]
description = "Install backend dependencies"
dir = "backend"
run = "uv sync --locked"

[tasks."frontend:setup"]
description = "Install frontend dependencies"
dir = "frontend"
run = "npm ci"

[tasks."frontend:api"]
description = "Generate the frontend API client"
dir = "frontend"
run = "npm run api:generate"

[tasks.setup]
description = "Set up repository dependencies and generated API client"
run = [
    { tasks = ["backend:setup", "frontend:setup"] },
    { task = "frontend:api" },
    "lefthook install",
]

[tasks."db:up"]
description = "Start the local PostgreSQL service"
run = "docker compose up --detach --wait postgres"

[tasks."db:down"]
description = "Stop the local PostgreSQL service"
run = "docker compose stop postgres"

[tasks."backend:migrate"]
description = "Apply backend development database migrations"
dir = "backend"
run = "uv run python manage.py migrate --noinput"

[tasks."compose:up"]
description = "Build and start the full local container stack"
run = "docker compose up --build --wait"

[tasks."compose:down"]
description = "Stop and remove the local container stack"
run = "docker compose down"

[tasks."backend:dev"]
description = "Start the backend development server"
dir = "backend"
run = "uv run poe dev"

[tasks."frontend:dev"]
description = "Start the frontend development server"
dir = "frontend"
run = "npm run dev"

[tasks.dev]
description = "Start the development environment"
run = [
    { task = "db:up" },
    { task = "backend:migrate" },
    { tasks = ["backend:dev", "frontend:dev"] },
]

[tasks."backend:format"]
description = "Format backend files"
dir = "backend"
run = "uv run poe format"

[tasks."frontend:format"]
description = "Format frontend files"
dir = "frontend"
run = "npm run format"

[tasks.format]
description = "Format the repository"
depends = ["backend:format", "frontend:format"]

[tasks."backend:ci"]
description = "Run backend checks"
dir = "backend"
run = "uv run poe ci"

[tasks."frontend:ci"]
description = "Run frontend checks"
dir = "frontend"
run = "npm run ci"
env = { _.file = "frontend/.env.test" }

[tasks.ci]
description = "Run all repository checks"
run = [
    { task = "db:up" },
    { task = "backend:ci" },
    { task = "frontend:ci" },
]
