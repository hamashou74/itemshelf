[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1",
    "djangorestframework>=3.18.0",
]

[dependency-groups]
dev = [
    "poethepoet>=0.48.0",
    "ruff>=0.16.4,<0.17",
]

[tool.poe.tasks]
lint = "ruff check ."
format = "ruff format ."
format-check = "ruff format --check ."
migrations-check = "python manage.py makemigrations --check"
check = "python manage.py check"
test = "python manage.py test"

[tool.poe.tasks.ci]
sequence = [
    "lint",
    "format-check",
    "migrations-check",
    "check",
    "test",
]
