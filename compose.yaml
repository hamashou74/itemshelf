x-backend-environment: &backend-environment
  DJANGO_SETTINGS_MODULE: config.settings.deployment
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
  DJANGO_ALLOWED_HOSTS: backend,127.0.0.1,localhost
  DATABASE_URL: postgresql://itemshelf:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/itemshelf

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: itemshelf
      POSTGRES_USER: itemshelf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itemshelf -d itemshelf"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  migrate:
    image: ${ITEMSHELF_BACKEND_IMAGE:-itemshelf-backend:local}
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "manage.py", "migrate", "--noinput"]
    restart: "no"

  backend:
    image: ${ITEMSHELF_BACKEND_IMAGE:-itemshelf-backend:local}
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).close()
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    image: ${ITEMSHELF_FRONTEND_IMAGE:-itemshelf-frontend:local}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      API_TIMEOUT_MS: "10000"
      BACKEND_API_ORIGIN: http://backend:8000
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${ITEMSHELF_BIND_ADDRESS:-127.0.0.1}:${ITEMSHELF_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/health')
          .then((response) => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
