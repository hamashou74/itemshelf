name: OAuth Toolkit Compatibility Spike

on:
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/oauth-toolkit-compat.yml"

permissions:
  contents: read

jobs:
  compatibility:
    name: Django 6.1 device flow
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@v4.3.0

      - name: Install backend dependencies
        run: mise run backend:setup

      - name: Install Django OAuth Toolkit candidate
        run: cd backend && uv pip install --python .venv/bin/python "django-oauth-toolkit==3.4.1"

      - name: Run compatibility smoke test
        env:
          DJANGO_SETTINGS_MODULE: config.settings.oauth_toolkit_compat
        run: |
          cd backend

          cat > config/settings/oauth_toolkit_compat.py <<'PY'
          from .test import *

          INSTALLED_APPS = [*INSTALLED_APPS, "oauth2_provider"]
          ROOT_URLCONF = "config.oauth_toolkit_compat_urls"

          OAUTH2_PROVIDER = {
              "OAUTH_DEVICE_VERIFICATION_URI": "https://itemshelf.example.test/device",
              "SCOPES": {
                  "items:read": "Read Itemshelf data",
                  "items:write": "Write Itemshelf data",
              },
              "DEFAULT_SCOPES": ["items:read", "items:write"],
              "COMPLIANT_BCP_RFC9700_TOKEN_STORAGE": True,
              "COMPLIANT_BCP_RFC9700_ACCESS_TOKEN_TRANSPORT": True,
              "REFRESH_TOKEN_REUSE_PROTECTION": True,
              "COMPLIANT_BCP_RFC9700_REFRESH_TOKEN": True,
          }
          PY

          cat > config/oauth_toolkit_compat_urls.py <<'PY'
          from django.urls import include, path
          from oauth2_provider.contrib.rest_framework import OAuth2Authentication, TokenHasScope
          from rest_framework.permissions import IsAuthenticated
          from rest_framework.response import Response
          from rest_framework.views import APIView


          class ProtectedView(APIView):
              authentication_classes = [OAuth2Authentication]
              permission_classes = [IsAuthenticated, TokenHasScope]
              required_scopes = ["items:read"]

              def get(self, request):
                  return Response({"user_id": str(request.user.pk)})


          urlpatterns = [
              path("o/", include("oauth2_provider.urls")),
              path("protected", ProtectedView.as_view()),
          ]
          PY

          uv run --no-sync python - <<'PY'
          import hashlib
          from urllib.parse import urlencode

          import django

          django.setup()

          from django.contrib.auth import get_user_model
          from django.core.management import call_command
          from django.test import Client
          from django.urls import reverse
          from oauth2_provider.models import (
              get_access_token_model,
              get_application_model,
              get_refresh_token_model,
          )

          call_command("migrate", verbosity=0, interactive=False)
          call_command("check", verbosity=1)

          User = get_user_model()
          Application = get_application_model()
          AccessToken = get_access_token_model()
          RefreshToken = get_refresh_token_model()

          developer = User.objects.create_user(
              username="scanner-developer",
              password="not-used-by-device",
          )
          owner = User.objects.create_user(
              username="scanner-owner",
              password="owner-password",
          )

          application = Application.objects.create(
              name="Itemshelf Scanner",
              user=developer,
              client_type=Application.CLIENT_PUBLIC,
              authorization_grant_type=Application.GRANT_DEVICE_CODE,
          )

          client = Client()

          authorization = client.post(
              reverse("oauth2_provider:device-authorization"),
              data=urlencode(
                  {
                      "client_id": application.client_id,
                      "scope": "items:read items:write",
                  }
              ),
              content_type="application/x-www-form-urlencoded",
          )
          assert authorization.status_code == 200, authorization.content
          authorization_data = authorization.json()
          device_code = authorization_data["device_code"]
          user_code = authorization_data["user_code"]

          token_payload = {
              "device_code": device_code,
              "client_id": application.client_id,
              "grant_type": "urn:ietf:params:oauth:grant-type:device_code",
          }

          pending = client.post(
              reverse("oauth2_provider:token"),
              data=urlencode(token_payload),
              content_type="application/x-www-form-urlencoded",
          )
          assert pending.status_code == 400, pending.content
          assert pending.json() == {"error": "authorization_pending"}

          assert client.login(username="scanner-owner", password="owner-password")

          submit_code = client.post(
              reverse("oauth2_provider:device"),
              data={"user_code": user_code},
          )
          assert submit_code.status_code == 302, submit_code.content

          approve = client.post(
              submit_code["Location"],
              data={"action": "accept"},
          )
          assert approve.status_code == 302, approve.content

          issued = client.post(
              reverse("oauth2_provider:token"),
              data=urlencode(token_payload),
              content_type="application/x-www-form-urlencoded",
          )
          assert issued.status_code == 200, issued.content
          token_data = issued.json()

          access_token = token_data["access_token"]
          refresh_token = token_data["refresh_token"]
          assert token_data["token_type"] == "Bearer"
          assert token_data["scope"] == "items:read items:write"

          access_checksum = hashlib.sha256(access_token.encode()).hexdigest()
          refresh_checksum = hashlib.sha256(refresh_token.encode()).hexdigest()

          access_record = AccessToken.objects.get(token_checksum=access_checksum)
          refresh_record = RefreshToken.objects.get(token_checksum=refresh_checksum)
          token_family = refresh_record.token_family
          assert token_family is not None
          assert access_record.token == ""
          assert refresh_record.token == ""
          assert access_record.user == owner
          assert refresh_record.user == owner

          protected = Client().get(
              "/protected",
              HTTP_AUTHORIZATION=f"Bearer {access_token}",
          )
          assert protected.status_code == 200, protected.content
          assert protected.json()["user_id"] == str(owner.pk)

          refreshed = client.post(
              reverse("oauth2_provider:token"),
              data=urlencode(
                  {
                      "grant_type": "refresh_token",
                      "refresh_token": refresh_token,
                      "client_id": application.client_id,
                  }
              ),
              content_type="application/x-www-form-urlencoded",
          )
          assert refreshed.status_code == 200, refreshed.content
          refreshed_data = refreshed.json()
          assert refreshed_data["refresh_token"] != refresh_token

          refreshed_checksum = hashlib.sha256(
              refreshed_data["refresh_token"].encode()
          ).hexdigest()
          refreshed_record = RefreshToken.objects.get(
              token_checksum=refreshed_checksum,
              revoked__isnull=True,
          )
          assert refreshed_record.token_family == token_family

          refreshed_access = refreshed_data["access_token"]
          protected_after_rotation = Client().get(
              "/protected",
              HTTP_AUTHORIZATION=f"Bearer {refreshed_access}",
          )
          assert protected_after_rotation.status_code == 200

          RefreshToken.revoke_family(token_family)

          revoked_device_access = Client().get(
              "/protected",
              HTTP_AUTHORIZATION=f"Bearer {refreshed_access}",
          )
          assert revoked_device_access.status_code in (401, 403)

          print("Django OAuth Toolkit 3.4.1 compatibility smoke test passed")
          PY
