name: Debug backend Ruff

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  diff:
    if: github.head_ref == 'chore/64-backend-environments'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version-file: backend/.python-version
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.6"
      - run: uv sync --locked
      - name: Show Ruff import fix
        run: uv run ruff check config/settings/development.py config/settings/test.py --fix --diff
