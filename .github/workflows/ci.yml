name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tooling:
    name: Repository tooling
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@v4.3.0

      - name: Install repository tooling
        run: mise run railway:setup

      - name: Type-check Railway IaC
        run: mise run railway:ci

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@v4.3.0

      - name: Install backend dependencies
        run: mise run backend:setup

      - name: Run backend CI
        run: mise run backend:ci

      - name: Check deployment settings
        env:
          DJANGO_SETTINGS_MODULE: config.settings.deployment
          DJANGO_SECRET_KEY: ci-deployment-check-secret-that-is-long-enough-for-django
          DJANGO_ALLOWED_HOSTS: localhost
          DATABASE_URL: "sqlite:///:memory:"
        run: cd backend && uv run python manage.py check --deploy --fail-level WARNING

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@v4.3.0

      - name: Install frontend dependencies
        run: mise run frontend:setup

      - name: Run frontend CI
        run: mise run frontend:ci

  containers:
    name: Containers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_PASSWORD: ci-postgres-password
      DJANGO_SECRET_KEY: ci-django-secret-key-that-is-long-enough-for-compose
      SESSION_SECRET: ci-session-secret-that-is-long-enough-for-compose

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Start Compose stack
        run: docker compose up --build --wait --wait-timeout 180

      - name: Verify frontend health
        run: curl --fail --show-error --silent http://127.0.0.1:3000/health

      - name: Verify frontend-to-backend database path
        run: docker compose exec -T frontend node --input-type=module < frontend/scripts/ci/verify-backend-health.mjs

      - name: Verify migrations are applied
        run: docker compose exec -T backend python manage.py migrate --check

      - name: Show Compose service state
        if: failure()
        continue-on-error: true
        run: docker compose ps --all

      - name: Show Compose logs
        if: failure()
        continue-on-error: true
        run: docker compose logs --no-color

      - name: Tear down Compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans
