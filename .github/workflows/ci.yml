name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@v4.3.0

      - name: Install backend dependencies
        run: mise run backend:setup

      - name: Run backend CI
        run: mise run backend:ci

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@v4.3.0

      - name: Install frontend dependencies
        run: mise run frontend:setup

      - name: Run frontend CI
        run: mise run frontend:ci
