name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: itemshelf
          POSTGRES_USER: itemshelf
          POSTGRES_PASSWORD: itemshelf-local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U itemshelf -d itemshelf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@v4.3.0

      - name: Install backend dependencies
        run: mise run backend:setup

      - name: Run backend CI
        run: mise run backend:ci

      - name: Check deployment settings
        env:
          DJANGO_SETTINGS_MODULE: config.settings.deployment
          DJANGO_SECRET_KEY: ci-deployment-check-secret-that-is-long-enough-for-django
          DJANGO_ALLOWED_HOSTS: localhost
          DATABASE_URL: postgresql://itemshelf:itemshelf-local@127.0.0.1:5432/itemshelf
        run: cd backend && uv run python manage.py check --deploy --fail-level WARNING

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@v4.3.0

      - name: Install frontend dependencies
        run: mise run frontend:setup

      - name: Run frontend CI
        run: mise run frontend:ci

  containers:
    name: Containers
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Build backend image
        run: docker build --file backend/Dockerfile --tag itemshelf-backend:ci .

      - name: Build frontend image
        run: docker build --file frontend/Dockerfile --tag itemshelf-frontend:ci .
