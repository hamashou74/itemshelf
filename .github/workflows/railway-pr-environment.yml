name: Manage PR environments (Railway)

on:
  pull_request_target:
    types: [opened, reopened, closed]

permissions: {}

env:
  RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
  RAILWAY_STAGING_ENVIRONMENT_ID: ${{ vars.RAILWAY_STAGING_ENVIRONMENT_ID }}
  PREVIEW_ENVIRONMENT: pr-${{ github.event.pull_request.number }}

jobs:
  create:
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.base.ref == 'master' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: railway-pr-management
    container: ghcr.io/railwayapp/cli:5.54.0
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}

    steps:
      - name: Link to project
        run: >-
          railway link
          --project "$RAILWAY_PROJECT_ID"
          --environment "$RAILWAY_STAGING_ENVIRONMENT_ID"

      - name: Create Railway environment for PR
        run: |
          railway environment new "$PREVIEW_ENVIRONMENT" \
            --copy "$RAILWAY_STAGING_ENVIRONMENT_ID" \
            --service-config frontend source.branch "$PR_HEAD_REF" \
            --service-config backend source.branch "$PR_HEAD_REF"

  delete:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: railway-pr-management
    container: ghcr.io/railwayapp/cli:5.54.0
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}

    steps:
      - name: Link to project
        run: >-
          railway link
          --project "$RAILWAY_PROJECT_ID"
          --environment "$RAILWAY_STAGING_ENVIRONMENT_ID"

      - name: Delete Railway environment for PR
        run: railway environment delete "$PREVIEW_ENVIRONMENT" --yes || true
