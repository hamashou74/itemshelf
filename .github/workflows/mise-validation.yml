name: Mise Validation

on:
  push:
    branches:
      - chore/69-mise-development-workflow

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@v4.2.3

      - name: Verify configured tools
        run: |
          mise exec -- python --version
          mise exec -- node --version
          mise exec -- uv --version

      - name: Run initial setup
        run: mise run setup

      - name: Verify setup is idempotent
        run: |
          before_backend=$(sha256sum backend/.env.development)
          before_frontend=$(sha256sum frontend/.env.development)
          mise run env:setup
          test "$before_backend" = "$(sha256sum backend/.env.development)"
          test "$before_frontend" = "$(sha256sum frontend/.env.development)"

      - name: Verify formatting is clean
        run: |
          mise run format
          git diff --exit-code

      - name: Run backend CI through mise
        run: mise run backend:ci

      - name: Run frontend CI through mise
        run: mise run frontend:ci

      - name: Run repository CI through mise
        run: mise run ci
