name: Regenerate Next.js lockfile

on:
  push:
    branches:
      - fix/37-upgrade-next-16-3-4

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: fix/37-upgrade-next-16-3-4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Regenerate lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git rm .github/workflows/regenerate-next-lockfile.yml
          git commit -m "chore(frontend): regenerate Next.js lockfile"
          git push origin HEAD:fix/37-upgrade-next-16-3-4
