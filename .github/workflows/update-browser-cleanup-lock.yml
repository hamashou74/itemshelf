name: Update browser cleanup lockfile

on:
  push:
    branches:
      - chore/47-remove-browser-django-api-path

permissions:
  contents: write

jobs:
  update-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7.0.1
        with:
          ref: chore/47-remove-browser-django-api-path

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(frontend): update lockfile after transport cleanup"
          git push origin HEAD:chore/47-remove-browser-django-api-path
